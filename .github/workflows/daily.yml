name: Boletin Mineria - georreferenciacion diaria

on:
  schedule:
    # 13:00 hora de Chile continental (UTC-4 en invierno). Ver README sobre
    # el desfase de 1 hora durante horario de verano en Chile.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Activar logs de depuracion del scraper'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          DEBUG_SCRAPER: ${{ github.event.inputs.debug }}
        run: python run_pipeline.py

      - name: Commit y push de resultados
        run: |
          git config user.name "boletin-mineria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Actualizacion diaria: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Subir logs como artifact (por si algo falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: docs/data/reporte_latest.json
          retention-days: 30
