name: Boletin Mineria - georreferenciacion diaria

on:
  schedule:
    # 13:00 hora de Chile continental (UTC-4 en invierno). Ver README sobre
    # el desfase de 1 hora durante horario de verano en Chile.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Activar logs de depuracion del scraper'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Imagen oficial de Playwright: trae Chromium + todas las dependencias del
    # sistema (libnss3, libatk, etc.) ya instaladas. Evita el paso
    # "playwright install --with-deps" que dependia de apt-get contra el
    # mirror de Ubuntu en Azure y que el 18-08-2026 se colgo ~30 min por un
    # mirror lento, haciendo que el job superara timeout-minutes y GitHub lo
    # cancelara automaticamente. La version de la imagen (v1.56.0-noble) debe
    # coincidir con la version de "playwright" pineada en requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          DEBUG_SCRAPER: ${{ github.event.inputs.debug }}
        run: python run_pipeline.py

      - name: Commit y push de resultados
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "boletin-mineria-bot"
          git -C "$GITHUB_WORKSPACE" config user.email "actions@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add docs/
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git -C "$GITHUB_WORKSPACE" commit -m "Actualizacion diaria: $(date -u +%Y-%m-%d)"
            git -C "$GITHUB_WORKSPACE" push
          fi

      - name: Avisar si aparecio una Sentencia de Exploracion/Explotacion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/aviso_sentencias.py

      - name: Subir logs como artifact (por si algo falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: docs/data/reporte_latest.json
          retention-days: 30
