name: Boletin Mineria - backfill historico 2026

# Job manual (no corre solo) para rellenar el historico con fechas pasadas
# EN UNA SOLA CORRIDA (muchas fechas seguidas).
#
# OJO (26-08-2026): dos intentos de correr esto con el rango completo (162
# fechas) chocaron con el anti-bot del sitio -- ni bajando el ritmo entre
# fechas ni reusando una sola sesion de Playwright ayudo; el patron "muchas
# fechas en una corrida" parece ser justo lo que el sitio detecta, sin
# importar el detalle tecnico. El unico patron confirmado que el sitio
# tolera es "una fecha por corrida" (el mismo que usa daily.yml todos los
# dias sin problema) -- para eso usar backfill-drip.yml en vez de este,
# que dispara de a una fecha cada 3 horas via cron. Dejar este workflow
# para rangos chicos puntuales (probar un par de fechas sueltas) en vez de
# para rellenar meses enteros de una vez.
#
# backfill.py es resumible: si el job se corta o llega al timeout a mitad
# de camino, basta con volver a lanzar el workflow (mismos start/end, o
# ninguno para usar los defaults) -- salta las fechas que ya quedaron
# commiteadas en docs/data/reporte_<AAAAMMDD>.json y sigue donde quedo.

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Fecha de inicio (DD-MM-AAAA)'
        type: string
        default: '01-01-2026'
      end:
        description: 'Fecha de fin (DD-MM-AAAA)'
        type: string
        default: '16-08-2026'

permissions:
  contents: write

jobs:
  backfill:
    # Grupo compartido con backfill-drip.yml: si se disparan varias corridas
    # de cualquiera de los dos workflows casi al mismo tiempo (ej. un loop
    # de "gh workflow run" lanzando muchas fechas de una), GitHub las hace
    # cola y las corre DE A UNA en vez de en paralelo -- asi nunca se
    # termina golpeando el sitio con varias sesiones simultaneas, aunque
    # el disparo en si sea rapido.
    concurrency:
      group: boletin-mineria-backfill
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Backfill completo estimado en 3-5 horas (dias habiles x descarga+
    # parseo+georreferenciacion de cada edicion). 340 min deja margen bajo
    # el limite de 360 min (6h) de GitHub para runners hosteados. Si no
    # alcanza a terminar, relanzar el workflow retoma donde quedo.
    timeout-minutes: 340
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Configurar identidad de git para los commits incrementales
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "boletin-mineria-bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr backfill (commitea y pushea por mes procesado)
        run: python backfill.py --start "${{ inputs.start }}" --end "${{ inputs.end }}"

      - name: Subir estado del backfill como artifact (para revisar fechas con error)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-state
          path: .backfill_state.json
          retention-days: 30
