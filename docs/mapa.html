ry": {"type": "Polygon", "coordinates": [[[-70.3702705037122, -26.812251508251883], [-70.36021091152787, -26.81234852910945], [-70.36031866649667, -26.821374814019872], [-70.3703790549893, -26.821277755355183], [-70.3702705037122, -26.812251508251883]]]}, "properties": {"cve": "2898854", "nombre": "CLAUDIO", "solicitante": "Céspedes Santis Daniela Carolina", "region": "REGIÓN DE ATACAMA", "provincia": "Provincia de Chañaral", "comuna": null, "superficie_ha": 100.0, "datum_original": "PSAD56", "huso": 19, "epsg_origen": 24879, "tipo_publicacion": "pedimento", "fuente_pdf": "http://www.diariooficial.interior.gob.cl/publicaciones/2026/11/11/44596/07/2898854.pdf", "archivo": "gm_pedimento_2898854.pdf", "fecha": "11-11-2026", "edicion": "44596"}}, {"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[-70.2752106064927, -28.175263804283144], [-70.24465657884838, -28.175544933059253], [-70.24476107389842, -28.18456985125627], [-70.2753176650296, -28.18428861657087], [-70.2752106064927, -28.175263804283144]]]}, "properties": {"cve": "2899205", "nombre": "ANDROMEDA 20", "solicitante": "Correa Echevarría Cristóbal", "region": "REGIÓN DE ATACAMA", "provincia": "Provincia de Huasco", "comuna": "Vallenar", "superficie_ha": 300.0, "datum_original": "PSAD56", "huso": 19, "epsg_origen": 24879, "tipo_publicacion": "pedimento", "fuente_pdf": "http://www.diariooficial.interior.gob.cl/publicaciones/2026/11/11/44596/07/2899205.pdf", "archivo": "gm_pedimento_2899205.pdf", "fecha": "11-11-2026", "edicion": "44596"}}, {"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[-72.36536528130686, -35.82604414519053], [-72.35430610272061, -35.82580107521271], [-72.35340823029614, -35.85282038035747], [-72.36447115143532, -35.85306369049296], [-72.36536528130686, -35.82604414519053]]]}, "properties": {"cve": "2898891", "nombre": "CELESTE 16", "solicitante": "Piro Vergara Alejandra Carolina", "region": "REGIÓN DEL MAULE", "provincia": "Provincia de Cauquenes", "comuna": null, "superficie_ha": 300.0, "datum_original": "PSAD56", "huso": 18, "epsg_origen": 24878, "tipo_publicacion": "pedimento", "fuente_pdf": "http://www.diariooficial.interior.gob.cl/publicaciones/2026/11/11/44596/07/2898891.pdf", "archivo": "gm_pedimento_2898891.pdf", "fecha": "11-11-2026", "edicion": "44596"}}, {"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[-72.35460512803044, -35.81679460859211], [-72.3214321296197, -35.816059544723636], [-72.32112936542778, -35.82506576928934], [-72.35430610272061, -35.82580107521271], [-72.35460512803044, -35.81679460859211]]]}, "properties": {"cve": "2898892", "nombre": "CELESTE 17", "solicitante": "Piro Vergara Alejandra Carolina", "region": "REGIÓN DEL MAULE", "provincia": "Provincia de Cauquenes", "comuna": null, "superficie_ha": 300.0, "datum_original": "PSAD56", "huso": 18, "epsg_origen": 24878, "tipo_publicacion": "pedimento", "fuente_pdf": "http://www.diariooficial.interior.gob.cl/publicaciones/2026/11/11/44596/07/2898892.pdf", "archivo": "gm_pedimento_2898892.pdf", "fecha": "11-11-2026", "edicion": "44596"}}, {"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[-72.32112936542778, -35.82506576928934], [-72.31007072099173, -35.82481863544925], [-72.30915788015066, -35.85183696994006], [-72.32022026642011, -35.85208434794702], [-72.32112936542778, -35.82506576928934]]]}, "properties": {"cve": "2898893", "nombre": "CELESTE 18", "solicitante": "Piro Vergara Alejandra Carolina", "region": "REGIÓN DEL MAULE", "provincia": "Provincia de Cauquenes", "comuna": null, "superficie_ha": 300.0, "datum_original": "PSAD56", "huso": 18, "epsg_origen": 24878, "tipo_publicacion": "pedimento", "fuente_pdf": "http://www.diariooficial.interior.gob.cl/publicaciones/2026/11/11/44596/07/2898893.pdf", "archivo": "gm_pedimento_2898893.pdf", "fecha": "11-11-2026", "edicion": "44596"}}]};

const map = L.map('map', { zoomControl: true });

// Embebido en un iframe (preview de la landing) vs. pagina abierta directo:
// el panel flotante se achica bastante mas cuando esta embebido, para que
// el mapa mismo se alcance a ver en un recuadro chico.
const embedded = window.self !== window.top;
if (embedded) document.querySelector('.panel').classList.add('panel--compact');

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19
});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri', maxZoom: 19
});
osm.addTo(map);
L.control.layers({ "Calles": osm, "Satelite": sat }).addTo(map);

const colors = {"pedimento": "#2563eb", "manifestacion": "#16a34a", "mensura": "#dc2626", "sentencia_exploracion": "#9333ea", "sentencia_explotacion": "#ea580c"};

function styleFor(feature) {
  const c = colors[feature.properties.tipo_publicacion] || '#888';
  return { color: c, weight: 2, fillColor: c, fillOpacity: 0.25 };
}
function bindPopup(feature, lyr) {
  const p = feature.properties;
  const html = `
    <div class="popup-title">${p.nombre || '(sin nombre)'}</div>
    <div class="popup-row"><b>Tipo:</b> ${p.tipo_publicacion}</div>
    <div class="popup-row"><b>CVE:</b> ${p.cve}</div>
    <div class="popup-row"><b>Fecha publicacion:</b> ${p.fecha || '-'}</div>
    <div class="popup-row"><b>Solicitante:</b> ${p.solicitante || '-'}</div>
    <div class="popup-row"><b>Region:</b> ${p.region || '-'}</div>
    <div class="popup-row"><b>Provincia:</b> ${p.provincia || '-'}</div>
    <div class="popup-row"><b>Superficie:</b> ${p.superficie_ha ? p.superficie_ha + ' ha' : '-'}</div>
    <div class="popup-row"><b>Datum origen:</b> ${p.datum_original} / Huso ${p.huso}</div>
    <div class="popup-row"><b>Fuente:</b> ${p.fuente_dato || 'Boletín Oficial de Minería'}</div>
    ${p.fuente_pdf ? `<div class="popup-row"><a class="pdf-link" href="${p.fuente_pdf}" target="_blank">Ver PDF original</a></div>` : ''}
  `;
  lyr.bindPopup(html);
}

if (data.features.length) {
  // Una capa Leaflet POR TIPO (no una sola combinada) -- asi el toggle de
  // la leyenda puede sacar/poner del mapa solo ese tipo con
  // map.removeLayer/addLayer, sin tener que reconstruir nada.
  const layersByType = {};
  const byType = {};
  for (const f of data.features) {
    const t = f.properties.tipo_publicacion;
    (byType[t] = byType[t] || []).push(f);
  }
  for (const t in byType) {
    const lyr = L.geoJSON({ type: 'FeatureCollection', features: byType[t] }, {
      style: styleFor,
      onEachFeature: bindPopup
    });
    lyr.addTo(map);
    layersByType[t] = lyr;
  }

  // Leyenda: cada item togglea su tipo (des-seleccionar = sacar la capa
  // del mapa y apagar visualmente el item; volver a clickear la trae de
  // vuelta). Dinamico, sin recargar la pagina.
  document.querySelectorAll('.legend-item[data-tipo]').forEach(function(el) {
    el.addEventListener('click', function() {
      const t = el.dataset.tipo;
      const lyr = layersByType[t];
      if (!lyr) return;
      if (map.hasLayer(lyr)) {
        map.removeLayer(lyr);
        el.classList.add('legend-item--off');
      } else {
        lyr.addTo(map);
        el.classList.remove('legend-item--off');
      }
    });
  });

  // El encuadre inicial es un cajon fijo (calibrado a mano contra una
  // captura de referencia: norte de Chile con contexto del NO argentino
  // de fondo) en vez de ajustarse a los limites exactos de ESTE dia. Un
  // caso aislado en un extremo (ej. una mensura puntual en Magallanes,
  // mucho mas al sur que el resto) no debe forzar un zoom abierto que
  // empequeñezca todo lo demas -- esos puntos siguen en el mapa (clic,
  // popup), solo no entran en el encuadre inicial.
  const CHILE_MINERO = [[-40.5, -84.0], [-22.3, -55.0]];
  // Padding asimetrico: reserva espacio en la esquina superior derecha para
  // el panel/leyenda flotante, asi el zoom no deja el territorio ni los
  // datos tapados detras del panel.
  map.fitBounds(CHILE_MINERO, { paddingTopLeft: [24, 24], paddingBottomRight: [embedded ? 170 : 190, 24] });
} else {
  map.setView([-33.45, -70.65], 5);
}
</script>
