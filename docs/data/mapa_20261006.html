-70.8576180759912, -29.82981347184236], [-70.85745123368311, -29.82079340294009]]]}, "properties": {"cve": "2880848", "nombre": "WHITE SCRATCH", "solicitante": "Lechuza Blanca Inversiones SpA", "region": "REGIÓN DE COQUIMBO", "provincia": "Provincia de Elqui", "comuna": "Vicuña", "superficie_ha": 100.0, "datum_original": "PSAD56", "huso": 19, "epsg_origen": 24879, "tipo_publicacion": "pedimento", "fuente_pdf": "http://www.diariooficial.interior.gob.cl/publicaciones/2026/10/06/44567/07/2880848.pdf", "archivo": "gm_pedimento_2880848.pdf", "fecha": "06-10-2026", "edicion": "44567"}}]};

const map = L.map('map', { zoomControl: true });

// Embebido en un iframe (preview de la landing) vs. pagina abierta directo:
// el panel flotante se achica bastante mas cuando esta embebido, para que
// el mapa mismo se alcance a ver en un recuadro chico.
const embedded = window.self !== window.top;
if (embedded) document.querySelector('.panel').classList.add('panel--compact');

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19
});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri', maxZoom: 19
});
osm.addTo(map);
L.control.layers({ "Calles": osm, "Satelite": sat }).addTo(map);

const colors = {"pedimento": "#2563eb", "manifestacion": "#16a34a", "mensura": "#dc2626", "sentencia_exploracion": "#9333ea", "sentencia_explotacion": "#ea580c"};

function styleFor(feature) {
  const c = colors[feature.properties.tipo_publicacion] || '#888';
  return { color: c, weight: 2, fillColor: c, fillOpacity: 0.25 };
}
function bindPopup(feature, lyr) {
  const p = feature.properties;
  const html = `
    <div class="popup-title">${p.nombre || '(sin nombre)'}</div>
    <div class="popup-row"><b>Tipo:</b> ${p.tipo_publicacion}</div>
    <div class="popup-row"><b>CVE:</b> ${p.cve}</div>
    <div class="popup-row"><b>Fecha publicacion:</b> ${p.fecha || '-'}</div>
    <div class="popup-row"><b>Solicitante:</b> ${p.solicitante || '-'}</div>
    <div class="popup-row"><b>Region:</b> ${p.region || '-'}</div>
    <div class="popup-row"><b>Provincia:</b> ${p.provincia || '-'}</div>
    <div class="popup-row"><b>Superficie:</b> ${p.superficie_ha ? p.superficie_ha + ' ha' : '-'}</div>
    <div class="popup-row"><b>Datum origen:</b> ${p.datum_original} / Huso ${p.huso}</div>
    <div class="popup-row"><b>Fuente:</b> ${p.fuente_dato || 'Boletín Oficial de Minería'}</div>
    ${p.fuente_pdf ? `<div class="popup-row"><a class="pdf-link" href="${p.fuente_pdf}" target="_blank">Ver PDF original</a></div>` : ''}
  `;
  lyr.bindPopup(html);
}

if (data.features.length) {
  // Una capa Leaflet POR TIPO (no una sola combinada) -- asi el toggle de
  // la leyenda puede sacar/poner del mapa solo ese tipo con
  // map.removeLayer/addLayer, sin tener que reconstruir nada.
  const layersByType = {};
  const byType = {};
  for (const f of data.features) {
    const t = f.properties.tipo_publicacion;
    (byType[t] = byType[t] || []).push(f);
  }
  for (const t in byType) {
    const lyr = L.geoJSON({ type: 'FeatureCollection', features: byType[t] }, {
      style: styleFor,
      onEachFeature: bindPopup
    });
    lyr.addTo(map);
    layersByType[t] = lyr;
  }

  // Leyenda: cada item togglea su tipo (des-seleccionar = sacar la capa
  // del mapa y apagar visualmente el item; volver a clickear la trae de
  // vuelta). Dinamico, sin recargar la pagina.
  document.querySelectorAll('.legend-item[data-tipo]').forEach(function(el) {
    el.addEventListener('click', function() {
      const t = el.dataset.tipo;
      const lyr = layersByType[t];
      if (!lyr) return;
      if (map.hasLayer(lyr)) {
        map.removeLayer(lyr);
        el.classList.add('legend-item--off');
      } else {
        lyr.addTo(map);
        el.classList.remove('legend-item--off');
      }
    });
  });

  // El encuadre inicial es un cajon fijo (calibrado a mano contra una
  // captura de referencia: norte de Chile con contexto del NO argentino
  // de fondo) en vez de ajustarse a los limites exactos de ESTE dia. Un
  // caso aislado en un extremo (ej. una mensura puntual en Magallanes,
  // mucho mas al sur que el resto) no debe forzar un zoom abierto que
  // empequeñezca todo lo demas -- esos puntos siguen en el mapa (clic,
  // popup), solo no entran en el encuadre inicial.
  const CHILE_MINERO = [[-40.5, -84.0], [-22.3, -55.0]];
  // Padding asimetrico: reserva espacio en la esquina superior derecha para
  // el panel/leyenda flotante, asi el zoom no deja el territorio ni los
  // datos tapados detras del panel.
  map.fitBounds(CHILE_MINERO, { paddingTopLeft: [24, 24], paddingBottomRight: [embedded ? 170 : 190, 24] });
} else {
  map.setView([-33.45, -70.65], 5);
}
</script>
